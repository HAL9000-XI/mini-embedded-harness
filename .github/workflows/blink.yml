name: ESP32 Blink Test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  esp32-test:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Run hardware test bench
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install platformio pyserial
          python run_tests.py
